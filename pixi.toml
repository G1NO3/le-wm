[workspace]
name = "le-wm-residual-flow"
version = "0.1.0"
description = "LeWorldModel with flow-matched latent residual kernels"
authors = ["Feiyang Wu <feiyangwu@gatech.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
libc = { family = "glibc", version = "2.31" }

[dependencies]
python = "3.10.*"
pip = ">=24"
git = "*"
imageio = ">=2.37,<3"
pytest = ">=8,<9"

[pypi-dependencies]
stable-worldmodel = { version = "==0.1.1", extras = ["train", "format"] }
stable-pretraining = "==0.1.8"
datasets = "==2.21.0"
huggingface-hub = ">=1.2,<2"
torch = ">=2.4,<3"
torchvision = "*"
ogbench = "==1.2.1"
gymnasium-robotics = "==1.4.2"
pygame = ">=2.6,<3"
pymunk = ">=7.1,<8"
shapely = ">=2.1,<3"

[tasks.check]
cmd = "python -m compileall jepa.py train.py residual_flow.py residual_memory.py residual_policy.py residual_kernels.py experiment_data.py stochastic_metrics.py stochastic_physics.py fixed_task_expert.py privileged_mpc.py scripts/data scripts/eval"
description = "Compile the main training and residual-flow entry points"

[tasks.test]
cmd = "python -m pytest -q"
description = "Run correctness tests for kernels, splits, stochastic physics, and MPC"

[tasks.smoke-import]
cmd = "python -c \"import torch, stable_pretraining, stable_worldmodel; import jepa, module, residual_flow, train; print('torch=', torch.__version__); print('cuda_available=', torch.cuda.is_available()); print('imports=ok')\""
description = "Import the complete training stack and report CUDA availability"

[tasks.smoke-cuda]
cmd = "python -c \"import torch; assert torch.cuda.is_available(), 'CUDA is unavailable'; x=torch.ones(1,device='cuda'); print('cuda=ok', torch.cuda.get_device_name(), x.device)\""
description = "Require CUDA and execute a tensor operation on the selected GPU"

[tasks.smoke-residual]
cmd = "python -c \"import torch; from residual_flow import ResidualFlow; d=torch.device('cuda' if torch.cuda.is_available() else 'cpu'); m=ResidualFlow(residual_dim=8, condition_dim=24, hidden_dim=16, depth=2, time_dim=8).to(d); z=torch.randn(2,3,8,device=d); y=m(torch.rand(2,3,1,device=d), z, torch.randn(2,3,24,device=d)); assert y.shape == z.shape and torch.isfinite(y).all(); print('residual_flow=ok', tuple(y.shape), 'device=', d)\""
description = "Run a small tensor-level ResidualFlow check"

[tasks.smoke-runtime]
cmd = "python scripts/smoke_runtime.py"
description = "Construct HDF5, PushT, and stochastic OGBench runtimes"

[tasks.smoke-memory]
cmd = "python scripts/eval/smoke_residual_memory.py"
description = "Require recurrent residual memory to beat a memoryless kernel on AR(1) futures"

[tasks.train-pusht]
cmd = "python train.py data=pusht"
description = "Train vanilla LeWM on PushT; Hydra overrides may be appended"

[tasks.train-pusht-residual]
cmd = "python train.py data=pusht loss.residual_flow.enabled=true"
description = "Train LeWM plus latent residual flow on PushT; overrides may be appended"

[tasks.evaluate-residual]
cmd = "python scripts/eval/evaluate_latent_residuals.py"
description = "Evaluate a residual-flow checkpoint; append --checkpoint and other arguments"

[feature.robocasa.dependencies]
python = "3.11.*"
git = "*"
rerun-sdk = "==0.22.1"
numpy = "==2.2.5"

[feature.robocasa.pypi-dependencies]
robosuite = { git = "https://github.com/ARISE-Initiative/robosuite.git" }
robocasa = { git = "https://github.com/robocasa/robocasa.git" }
stable-worldmodel = { version = "==0.1.1", extras = ["train", "format"] }
stable-pretraining = "==0.1.8"
datasets = "==2.21.0"
torch = ">=2.4,<3"
torchvision = "*"

[feature.robocasa.tasks.setup-robocasa]
cmd = "python -m robocasa.scripts.setup_macros"
description = "Configure RoboCasa paths; assets are intentionally downloaded separately"

[feature.robocasa.tasks.robocasa-smoke]
cmd = "python -c \"import robocasa, robosuite, stable_worldmodel, torch; print('robocasa=ok', robosuite.__version__, torch.__version__)\""
description = "Import the RoboCasa and LeWM runtime without downloading assets"

[environments]
robocasa = { features = ["robocasa"], no-default-feature = true }
