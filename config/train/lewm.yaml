defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  residual_flow:
    enabled: False
    kernel_type: flow
    conditioning: conditional
    weight: 1.0
    ema_decay: 0.99
    scale_eps: 0.001
    detach_residual_target: True
    detach_condition: True
    nominal_checkpoint: null
    residual_scale_path: null
    freeze_nominal: False
    memory:
      enabled: False
      hidden_dim: 128
      # Optional deployable low-dimensional observation whose transition delta
      # is provided only while updating memory from observed history.
      observation_key: null
      max_history_updates: 5
      sampled_history_probability: 0.0
      sampling_steps: 4
    kernel_kwargs:
      hidden_dim: 512
      depth: 3
    kwargs:
      hidden_dim: 512
      depth: 4
      time_dim: 128
      dropout: 0.0
